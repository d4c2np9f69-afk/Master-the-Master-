*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#f5f5f7;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
:root{--tr:#CC0000;--trd:#8B0000;--trl:#fff0f0;--bg1:#fff;--bg2:#f5f5f7;--bg3:#ebebf0;--tx1:#111;--tx2:#6e6e73;--bd1:#c7c7cc;--bd2:#d1d1d6;--bd3:#e5e5ea;}
@media(prefers-color-scheme:dark){:root{--bg1:#1c1c1e;--bg2:#2c2c2e;--bg3:#111;--tx1:#f5f5f5;--tx2:#8e8e93;--bd1:#3a3a3c;--bd2:#3a3a3c;--bd3:#2c2c2e;}}
/* layout */
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg3);}
#tabbar{display:flex;flex-shrink:0;background:var(--bg1);border-top:0.5px solid var(--bd2);padding:6px 0 max(4px,env(safe-area-inset-bottom));}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px 0;font-family:-apple-system,sans-serif;}
.ti .ic{font-size:21px;line-height:1;}
.ti .lb{font-size:9px;font-weight:600;color:var(--tx2);letter-spacing:.2px;}
.ti.on .lb{color:var(--tr);}
/* app chrome */
#hdr{background:linear-gradient(135deg,#111 0%,#2d0000 55%,#111 100%);padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:2px solid #CC0000;display:flex;justify-content:space-between;align-items:center;}
/* cards & common */
.card{background:var(--bg1);border-radius:12px;border:0.5px solid var(--bd3);padding:14px 16px;margin-bottom:10px;border-top:3px solid var(--tr);}
.card.nt{border-top:0.5px solid var(--bd3);}
.sec{font-size:10px;font-weight:700;color:var(--tx2);letter-spacing:.7px;text-transform:uppercase;margin-bottom:8px;padding-bottom:7px;border-bottom:0.5px solid var(--bd3);display:flex;justify-content:space-between;align-items:center;}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--bd3);font-size:12px;color:var(--tx1);}
.row:last-child{border-bottom:none;}
.btn{border-radius:7px;border:none;background:var(--tr);color:#fff;font-size:12px;font-weight:600;padding:5px 13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.btn.sm{font-size:11px;padding:3px 9px;}
.btn.ghost{background:transparent;border:1.5px solid var(--tr);color:var(--tr);}
.btn.grn{background:#16a34a;}
.btn.gry{background:var(--bg2);color:var(--tx1);border:0.5px solid var(--bd2);}
.btn.yt{background:#FF0000;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;text-decoration:none;}
.mi{background:var(--bg2);border:0.5px solid var(--bd2);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--tx1);font-family:inherit;width:100%;outline:none;}
.mi:focus{border-color:var(--tr);}
.pbar{height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:4px;}
.pbar-f{height:100%;border-radius:99px;}
.stab{border-radius:7px;border:0.5px solid var(--bd2);background:var(--bg1);color:var(--tx2);font-size:11px;font-weight:500;padding:4px 10px;cursor:pointer;font-family:inherit;}
.stab.on{background:var(--tr);color:#fff;border-color:var(--tr);}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--bd3);cursor:pointer;}
.prow:last-child{border-bottom:none;}
.rlink{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:8px;margin-bottom:6px;text-decoration:none;border:0.5px solid;}
input[type=range]{accent-color:var(--tr);width:100%;cursor:pointer;}
input[type=checkbox]{accent-color:var(--tr);cursor:pointer;width:14px;height:14px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 1.6s ease-in-out infinite;}
#pg{padding:12px 12px 24px;}
</style>

// ── helpers ─────────────────────────────────────────────────────────────────
const WARN=5;
function gi(v){return v>=90?{l:"Excellent",c:"#16a34a"}:v>=75?{l:"Good",c:"#d97706"}:v>=60?{l:"Fair",c:"#ea580c"}:{l:"Poor",c:"#CC0000"};}
function ring(val,color,sz=54){
  const r=(sz-8)/2,circ=2*Math.PI*r,dash=(val/100)*circ;
  return`<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="5"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/></svg>`;
}
function yt(p,sm){const v=VIDEOS[p];if(!v)return"";return`<a href="${v.url}" target="_blank" class="btn yt${sm?" sm":""}">▶ ${v.yr?"'"+String(v.yr).slice(2)+" ":""}How-To</a>`;}
function crit(show){return show?`<span style="background:#fee2e2;color:#CC0000;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px">CRITICAL</span>`:"";}
function gAlerts(hrs,dm,ld){
  const o=[];
  for(const t of SCHED){
    if(t.oneTime){if(hrs>=t.interval&&!dm.includes(t.id))o.push({...t,dueAt:t.interval,overdue:true,dismissKey:t.id});}
    else{const last=ld[t.id]??0,next=last+t.interval,diff=next-hrs;
      if(diff<=0&&!dm.includes(t.id+"_"+next))o.push({...t,dueAt:next,overdue:true,dismissKey:t.id+"_"+next});
      else if(diff>0&&diff<=WARN&&!dm.includes(t.id+"_w_"+next))o.push({...t,dueAt:next,dueSoon:true,hoursLeft:Math.round(diff*10)/10,dismissKey:t.id+"_w_"+next});}
  }return o;
}
function gUpcoming(hrs,ld){
  return SCHED.map(t=>{const last=ld[t.id]??0,next=t.oneTime?t.interval:last+t.interval;return{...t,nextAt:next,hoursLeft:next-hrs};})
    .filter(t=>t.hoursLeft>0).sort((a,b)=>a.hoursLeft-b.hoursLeft).slice(0,5);
}
function markDone(tid){
  const ld={...(R.maint_last_done||{})};ld[tid]=R.hour_meter.reading;
  const dm=(R.maint_dismissed||[]).filter(d=>d!==tid);
  patch({maint_last_done:ld,maint_dismissed:dm});
}
function dismissA(key){patch({maint_dismissed:[...(R.maint_dismissed||[]),key]});}
function scoreChg(k,v){const sc={...R.condition_scores,[k]:parseInt(v)};const a=[sc.deck,sc.engine,sc.transmission,sc.ignition];sc.overall=Math.round(a.reduce((x,y)=>x+y,0)/4);patch({condition_scores:sc});}
function toggleCart(i){const l=[...(R.shopping_list||[])];const p=l.indexOf(i);p===-1?l.push(i):l.splice(p,1);patch({shopping_list:l});}

function pgMaint(hrs,al,ov,wn,up,ld){

  const hdr=`<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="stab${stab===k?" on":""}" onclick="stab='${k}';render()">${l}</button>`).join("")}</div>`;

  if(stab==="schedule") return hdr+`
    <div class="card">
      <div class="sec">Before Each Use</div>
      ${[["Engine Oil Level","Check & add — dipstick full"],["Blade-Brake-Clutch","Test — blades stop within 3 sec"],["Cutting Blades","Inspect for nicks & cracks"],["Air Filter","Check / tap clean"],["Under Deck","Washout port — run blades 1 min"]]
        .map((r,i)=>`<div style="display:flex;gap:10px;padding:8px 0;${i<4?'border-bottom:0.5px solid var(--bd3)':''}">
          <div style="width:22px;height:22px;border-radius:50%;background:#fff0f0;border:1.5px solid #fecaca;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#CC0000;flex-shrink:0;margin-top:1px">${i+1}</div>

        </div>`).join("")}
    </div>
    <div class="card">
      <div class="sec">Hour-Based Schedule</div>
      ${SCHED.map((t,i)=>{const last=ld[t.id]??0,next=t.oneTime?t.interval:last+t.interval,pct=Math.min(100,t.oneTime?(hrs/t.interval)*100:((hrs-last)/t.interval)*100),isO=hrs>=next,isS=!isO&&(next-hrs)<=WARN,sc=isO?"#CC0000":isS?"#d97706":"#16a34a";
        return`<div style="padding:9px 0;${i<SCHED.length-1?'border-bottom:0.5px solid var(--bd3)':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">

  if(stab==="upcoming") return hdr+`

        <div style="font-size:12px;font-weight:700;color:#CC0000;margin-bottom:2px">⚠ ${a.label}</div>
        <div style="font-size:11px;color:#CC0000">Overdue at ${a.dueAt} hrs</div>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn grn sm" onclick="markDone('${a.id}')">✓ Done</button>
          <button class="btn gry sm" onclick="dismissA('${a.dismissKey}')">Dismiss</button>
          ${yt(a.part)}
        </div>
      </div>`).join("")}
    <div class="card">
      <div class="sec">Next Scheduled</div>
      ${up.map(t=>{const c=t.hoursLeft<=0?"#CC0000":t.hoursLeft<=WARN?"#d97706":"#16a34a";return`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--bd3)">
          <div><div style="font-size:12px;font-weight:600;color:var(--tx1)">${t.label}</div>
            <div style="font-size:10px;color:var(--tx2)">Due @ ${Math.round(t.nextAt*10)/10} hrs</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">

  const yr=R.annual_year||2026,done=ANNUAL.filter(t=>(R.annual_done||{})[t.id]===yr).length,pct=Math.round((done/ANNUAL.length)*100);
  return hdr+`

      <select class="mi" style="width:90px" onchange="patch({annual_year:parseInt(this.value)})">${[2024,2025,2026,2027,2028].map(y=>`<option${y===yr?" selected":""}>${y}</option>`).join("")}</select>
      <div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:3px"><span>${done}/${ANNUAL.length}</span><span style="color:${done===ANNUAL.length?"#16a34a":"#CC0000"};font-weight:700">${pct}%</span></div>
      <div class="pbar"><div class="pbar-f" style="width:${pct}%;background:${done===ANNUAL.length?"#16a34a":"#CC0000"}"></div></div></div>
    </div>
    <div class="card">
      <div class="sec">End-of-Season — ${yr}</div>
      ${ANNUAL.map((t,i)=>{const d=(R.annual_done||{})[t.id]===yr;return`
        <div style="display:flex;gap:10px;padding:8px 0;${i<ANNUAL.length-1?'border-bottom:0.5px solid var(--bd3)':''}">
          <input type="checkbox" ${d?"checked":""} onchange="const ad={...R.annual_done};d?delete ad['${t.id}']:ad['${t.id}']=${yr};patch({annual_done:ad})" style="margin-top:2px">
          <div><span style="font-size:12px;font-weight:600;color:var(--tx1);${d?'text-decoration:line-through;opacity:.5':''}">${t.label}</span>
          ${crit(t.critical&&!d)}${d?`<span style="font-size:10px;color:#16a34a;font-weight:600;margin-left:5px">✓ Done</span>`:""}
          <div style="font-size:11px;color:var(--tx2);margin-top:1px">${t.detail}</div></div>
        </div>`;}).join("")}
    </div>`;
}

// ── nav & render ──────────────────────────────────────────────────────────────
function go(n){
  view=n;
  document.querySelectorAll('.ti').forEach((el,i)=>el.classList.toggle('on',i===n));
  document.getElementById('scroller').scrollTop=0;
  render();
}

function render(){
  if(!R)return;
  const hrs=R.hour_meter.reading,ld=R.maint_last_done||{},dm=R.maint_dismissed||[];
  const al=gAlerts(hrs,dm,ld),up=gUpcoming(hrs,ld);
  const ov=al.filter(a=>a.overdue).length,wn=al.filter(a=>a.dueSoon).length;
  const cart=R.shopping_list||[];

  // header badge
  const badge=document.getElementById('hdrBadge');
  if(badge){
    badge.innerHTML=ov>0?`<span class="pulse" style="background:#CC0000;color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600">⚠ ${ov} overdue</span>`
      :`<span style="background:#16a34a;color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600">✓ All current</span>`;
  }
  // shop tab label
  const sl=document.getElementById('shoplbl');
  if(sl)sl.textContent=cart.length>0?`Shop(${cart.length})`:'Shop';

  let html="";
  if(view===0)html=pgDash(hrs,al,ov,wn,up,ld);
  if(view===1)html=pgMaint(hrs,al,ov,wn,up,ld);
  if(view===2)html=pgParts();
  if(view===3)html=pgDiag();
  if(view===4)html=pgLog();
  if(view===5)html=pgShop();

  document.getElementById('pg').innerHTML=html+`<div style="text-align:center;padding:14px 0 6px;font-size:9px;color:var(--tx2);letter-spacing:1px">TORO TIMEMASTER 21200 · SN 401338948 · MAINTAINED TO WIN</div>`;
}

// ── init ──────────────────────────────────────────────────────────────────────
try{const s=localStorage.getItem(SK);R=s?JSON.parse(s):JSON.parse(JSON.stringify(INIT));}catch(e){R=JSON.parse(JSON.stringify(INIT));}
if(!R.shopping_list)R.shopping_list=[];
render();
</script>
